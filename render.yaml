services:
  - type: web
    name: frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: 5173
    headers:
      - path: /*
        name: Cache-Control
        value: no-store
      - path: /lp/*
        name: X-Robots-Tag
        value: noindex, nofollow
    routes:
      - type: redirect
        source: /moving.html
        destination: /moving
      - type: rewrite
        source: /*
        destination: /index.html
